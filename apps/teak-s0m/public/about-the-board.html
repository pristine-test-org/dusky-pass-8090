<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About the Teak board</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #1c1c1c; background: #fafaf7; }
      body { margin: 0; --accent: #3b4bc8; }
      header, section, footer { max-width: 44rem; margin: 0 auto; padding: 1.25rem 1rem; }
      header { display: flex; justify-content: space-between; align-items: center; }
      .mark { font-weight: 700; color: var(--accent); }
      /* Intentional, for Impeccable's test drive: link text under the 11px floor. */
      header a { color: var(--accent); font-size: 10px; }
      /* Intentional, for Impeccable's test drive: gradient text on the heading. */
      h1 {
        font-size: clamp(2rem, 6vw, 3.25rem);
        background: linear-gradient(90deg, #3b4bc8, #2f7d4f);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      /* Intentional, for Impeccable's test drive: low-contrast text, light grey on the page background. */
      .note { color: #c9c9c4; }
      /* Intentional, for Impeccable's test drive: a layout property in a transition. */
      .bar { height: 0.5rem; width: 30%; background: var(--accent); border-radius: 0.25rem; transition: width 0.3s; }
      .bar:hover { width: 100%; }
      /* Intentional, for Impeccable's test drive: body text flush with the viewport edges, no background. */
      .edge { margin: 0; padding: 0; max-width: none; line-height: 1.6; }
    </style>
  </head>
  <body>
    <header>
      <span class="mark">Teak</span>
      <a href="/">Back to the board</a>
    </header>
    <section>
      <h1>About the Teak board</h1>
      <p>Teak lays the whole shared list out on one board, so nothing hides below the fold.</p>
      <p class="note">The board stays current without any action from you.</p>
      <div class="bar" aria-hidden="true"></div>
    </section>
    <p class="edge">Every card on the board comes straight from the shared list, with finished items marked off at a glance.</p>
    <footer>Teak</footer>
  </body>
</html>
